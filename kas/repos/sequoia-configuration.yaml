header:
  version: 14

repos:
  # Sequoia-Configuration ships its own meta-webconfig Yocto layer (the
  # on-device WebConfig daemon + static frontend + schemas + board
  # manifest). Only that subdirectory is a layer; the rest of the repo
  # (Rust workspace, frontend source) is not needed by the build.
  sequoia-configuration:
    url: git@github.com:soccentric-sequoia/Sequoia-Configuration.git
    branch: develop
    path: meta/sequoia-configuration
    layers:
      meta-webconfig:
